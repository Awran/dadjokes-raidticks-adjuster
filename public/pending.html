<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Access Pending Approval</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: #0b1220;
        color: #e2e8f0;
        padding: 24px;
      }

      .card {
        width: min(680px, 100%);
        border: 1px solid #243045;
        background: #111a2b;
        border-radius: 14px;
        padding: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.4rem;
      }

      p {
        margin: 8px 0;
        line-height: 1.5;
        color: #cbd5e1;
      }

      code {
        background: #0c1423;
        border: 1px solid #243045;
        border-radius: 8px;
        padding: 2px 6px;
      }

      .actions {
        margin-top: 18px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      a.button {
        text-decoration: none;
        border: 1px solid #334155;
        color: #e2e8f0;
        padding: 8px 12px;
        border-radius: 10px;
        font-weight: 600;
      }

      a.button.primary {
        background: #f4a261;
        color: #111827;
        border-color: #f4a261;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 id="pending-title">Access pending approval</h1>
      <p id="pending-line-1">You are signed in, but your account has not been granted access to this site yet.</p>
      <p id="pending-line-2">An administrator needs to map one of your Discord roles to the app <code>member</code> or <code>admin</code> role.</p>
      <p id="pending-line-3">After approval, refresh this page or click Return to App.</p>
      <div class="actions">
        <a id="discord-invite-link" class="button" href="https://discord.dadjokes.red" target="_blank" rel="noopener noreferrer" style="display: none;">Join Discord</a>
        <a class="button primary" href="/">Return to App</a>
        <a id="signout-link" class="button" href="#">Sign out</a>
      </div>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search)
      const reason = params.get('reason')

      const titleEl = document.getElementById('pending-title')
      const line1El = document.getElementById('pending-line-1')
      const line2El = document.getElementById('pending-line-2')
      const line3El = document.getElementById('pending-line-3')
      const inviteLinkEl = document.getElementById('discord-invite-link')

      if (reason === 'not-in-guild') {
        titleEl.textContent = 'Join DadJokes Discord first'
        line1El.textContent = 'Your Discord account is not currently a member of the DadJokes Discord server.'
        line2El.innerHTML = 'Join the server, then have an admin map one of your Discord roles to app <code>member</code> or <code>admin</code>.'
        line3El.textContent = 'After joining and being assigned a role, return to the app and sign in again.'
        inviteLinkEl.style.display = 'inline-block'
      } else if (reason === 'guild-unavailable') {
        titleEl.textContent = 'Unable to verify Discord server membership'
        line1El.textContent = 'We could not verify your membership for the configured DadJokes Discord server.'
        line2El.innerHTML = 'If you are not in the server yet, join first. If you are already in it, ask an admin to verify the configured guild and role mapping IDs.'
        line3El.textContent = 'After joining or after configuration is corrected, return to the app and sign in again.'
        inviteLinkEl.style.display = 'inline-block'
      }

      const signOutLink = document.getElementById('signout-link')
      signOutLink?.addEventListener('click', async (event) => {
        event.preventDefault()
        try {
          await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
        } catch (_) {
          // ignore and continue to SWA logout fallback
        }

        window.location.href = '/.auth/logout?post_logout_redirect_uri=/'
      })
    </script>
  </body>
</html>
