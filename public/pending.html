<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Access Pending Approval</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: #0b1220;
        color: #e2e8f0;
        padding: 24px;
      }

      .card {
        width: min(680px, 100%);
        border: 1px solid #243045;
        background: #111a2b;
        border-radius: 14px;
        padding: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.4rem;
      }

      p {
        margin: 8px 0;
        line-height: 1.5;
        color: #cbd5e1;
      }

      code {
        background: #0c1423;
        border: 1px solid #243045;
        border-radius: 8px;
        padding: 2px 6px;
      }

      .actions {
        margin-top: 18px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      a.button {
        text-decoration: none;
        border: 1px solid #334155;
        color: #e2e8f0;
        padding: 8px 12px;
        border-radius: 10px;
        font-weight: 600;
      }

      a.button.primary {
        background: #f4a261;
        color: #111827;
        border-color: #f4a261;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Access pending approval</h1>
      <p>You are signed in, but your account has not been granted access to this site yet.</p>
      <p>An administrator needs to map one of your Discord roles to the app <code>member</code> or <code>admin</code> role.</p>
      <p>After approval, refresh this page or click Return to App.</p>
      <div class="actions">
        <a class="button primary" href="/">Return to App</a>
        <a id="signout-link" class="button" href="#">Sign out</a>
      </div>
    </main>
    <script>
      const signOutLink = document.getElementById('signout-link')
      signOutLink?.addEventListener('click', async (event) => {
        event.preventDefault()
        try {
          await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
        } catch (_) {
          // ignore and continue to SWA logout fallback
        }

        window.location.href = '/.auth/logout?post_logout_redirect_uri=/'
      })
    </script>
  </body>
</html>
